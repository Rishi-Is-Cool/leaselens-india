# Render blueprint for the LeaseLens API (free plan, Docker: the image carries Tesseract
# for scanned leases, which Render's native Python runtime cannot install).
# The database is Supabase, not a Render Postgres. Secrets are entered in the dashboard
# when the blueprint is applied (sync: false) and never live in git.
services:
  - type: web
    name: leaselens-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The Supabase session-pooler URI, scheme rewritten to postgresql+psycopg://
      - key: DATABASE_URL
        sync: false
      # Groq key: turns on plain-language explanations, cross-clause links and chat.
      # The API runs without it (offline risk model + statute matching only).
      - key: LLM_API_KEY
        sync: false
